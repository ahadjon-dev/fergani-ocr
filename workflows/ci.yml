name: CI - Fergani OCR

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_fergani_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-ara \
            poppler-utils \
            libpq-dev

          # Verify Tesseract installation
          tesseract --version

      - name: 📚 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fergani/requirements.txt
          pip install flake8 black isort coverage

      - name: 🎨 Check code formatting with Black
        working-directory: ./fergani
        run: |
          black --check .
        continue-on-error: false

      - name: 📋 Check import sorting with isort
        working-directory: ./fergani
        run: |
          isort --check-only .
        continue-on-error: false

      - name: 🔍 Lint with flake8
        working-directory: ./fergani
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🔧 Check for missing migrations
        working-directory: ./fergani
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_fergani_ocr
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          python manage.py makemigrations --check --dry-run --no-input

      - name: 🗄️ Run migrations
        working-directory: ./fergani
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_fergani_ocr
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          python manage.py migrate --no-input

      - name: 🧪 Run tests with coverage
        working-directory: ./fergani
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_fergani_ocr
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: |
          coverage run --source='ocr' manage.py test tests/
          coverage report --fail-under=70
          coverage xml

      - name: 📊 Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        with:
          file: ./fergani/coverage.xml
          flags: unittests
          name: codecov-fergani-ocr
        continue-on-error: true

      - name: ✅ All checks passed
        run: |
          echo "✅ All quality checks passed!"
          echo "✅ Code formatting: OK"
          echo "✅ Linting: OK"
          echo "✅ Migrations: OK"
          echo "✅ Tests: OK"
