services:
  - type: web
    name: fergani-ocr
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd fergani && pip install -r ../requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: cd fergani && gunicorn fergani.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: fergani.settings
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/ocr/health/

databases:
  - name: fergani-db
    plan: free
    databaseName: fergani_ocr
    user: fergani
